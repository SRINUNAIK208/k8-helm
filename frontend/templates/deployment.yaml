apiVersion: apps/v1 
kind: Deployment 
metadata:
   namespace: roboshop 
   name: frontend
   labels:
     project: roboshop 
     component: frontend
     env: dev 
     tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
       project: roboshop
       component: frontend
       env: dev 
       tier: frontend 
  template:
    metadata:
      labels:
        project: roboshop 
        component: frontend
        env: dev 
        tier: frontend 
    spec:
      containers:
      - name: frontend
        image: "{{ .Values.deployment.imageURL }}:{{ .Values.deployment.imageVersion}}""
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"

      volumes:
      - name: nginx-conf 
        configMap:
          name: nginx-conf
          items:
          - key: nginx.conf
            path: nginx.conf

         
        
